name: reference-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e . scipy
      - run: python -m unittest discover -s tests -v
      - run: calms-savant demo --directory ci_demo
      - run: calms-savant inspect ci_demo/state.json
      - run: calms-savant benchmark --seeds 1 --epochs 3 --output ci_benchmark.json
